<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8" />
<style>html,body{margin:0;padding:0;background:transparent;overflow:hidden}</style>
</head>
<body>
<script type="importmap">
{ "imports": { "three": "./node_modules/three/build/three.module.js" } }
</script>
<!--
  小猫奔跑精灵图生成器（three.js）
  用法见同目录 README.md：
    npm install three@0.160.0
    python render.py     # 渲染 12 帧到 frames/
    python pack.py       # 打包为 cat_run.png（12 帧横向精灵图）
  输出需复制到 app/src/main/res/drawable-nodpi/cat_run_sheet.png
-->
<script type="module">
import * as THREE from 'three';

// ─────────────────────────────────────────────
// 可爱橘猫 · 正面小跑循环（3D 几何体拼装）
// 设计要点：
//  · 正面朝向镜头，双眼可见 —— 侧身剪影读不出"可爱"
//  · Q 版比例：头大身小，耳朵圆锥，腮红、奶白肚皮
//  · 跑动：对角腿同相抬起 + 身体上下弹跳 + 尾巴逐节延迟摆动
// ─────────────────────────────────────────────

const SCENE_W = 192;
const SCENE_H = 192;
const FRAMES = 12;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(SCENE_W, SCENE_H);
renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();

const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.01, 100);
camera.position.set(0, 0, 20);
camera.lookAt(0, 0, 0);

// ── 光照 ──
scene.add(new THREE.AmbientLight(0xfff4e2, 1.0));
const key = new THREE.DirectionalLight(0xffffff, 1.35);
key.position.set(2.5, 4, 6);
scene.add(key);
const rim = new THREE.DirectionalLight(0xffd9a0, 0.55);
rim.position.set(-3, 1.5, 3);
scene.add(rim);

// ── 材质 ──
const FUR   = new THREE.MeshToonMaterial({ color: 0xF5A45F });
const FUR_D = new THREE.MeshToonMaterial({ color: 0xE08B48 });
const CREAM = new THREE.MeshToonMaterial({ color: 0xFFF4E6 });
const PINK  = new THREE.MeshToonMaterial({ color: 0xF9A9A9 });
const DARK  = new THREE.MeshToonMaterial({ color: 0x3A2A20 });
const WHITE = new THREE.MeshToonMaterial({ color: 0xFFFFFF });
const BOW   = new THREE.MeshToonMaterial({ color: 0xE9703C });

const cat = new THREE.Group();
scene.add(cat);

// ── 身体（Q 版：圆胖）──
const body = new THREE.Mesh(new THREE.SphereGeometry(0.46, 30, 24), FUR);
body.scale.set(1.02, 0.94, 0.9);
body.position.set(0, 0, 0);
cat.add(body);

// 奶白肚皮
const belly = new THREE.Mesh(new THREE.SphereGeometry(0.34, 22, 18), CREAM);
belly.scale.set(0.86, 0.9, 0.55);
belly.position.set(0, -0.04, 0.2);
cat.add(belly);

// ── 头 ──
const headPivot = new THREE.Group();
headPivot.position.set(0, 0.5, 0.04);
cat.add(headPivot);

const head = new THREE.Mesh(new THREE.SphereGeometry(0.40, 30, 24), FUR);
head.scale.set(1.04, 0.96, 0.96);
headPivot.add(head);

// 脸颊奶白
const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 16), CREAM);
muzzle.scale.set(1.2, 0.76, 0.62);
muzzle.position.set(0, -0.14, 0.30);
headPivot.add(muzzle);

// 耳朵（圆锥 + 粉色内耳）
const earGeo = new THREE.ConeGeometry(0.155, 0.32, 20);
const earInGeo = new THREE.ConeGeometry(0.085, 0.18, 16);
[[-0.20, 0.30, -0.30], [0.20, 0.30, 0.30]].forEach(([ex, ey, tilt]) => {
  const ear = new THREE.Mesh(earGeo, FUR);
  ear.position.set(ex, ey, -0.02);
  ear.rotation.z = tilt;
  ear.rotation.x = -0.12;
  headPivot.add(ear);
  const inner = new THREE.Mesh(earInGeo, PINK);
  inner.position.set(ex * 0.92, ey - 0.015, 0.035);
  inner.rotation.z = tilt;
  inner.rotation.x = -0.12;
  headPivot.add(inner);
});

// 眼睛（黑豆 + 高光）
[[-0.145, 0.055, 0.335], [0.145, 0.055, 0.335]].forEach(([ex, ey, ez]) => {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.062, 16, 14), DARK);
  eye.scale.set(1, 1.12, 0.7);
  eye.position.set(ex, ey, ez);
  headPivot.add(eye);
  const spark = new THREE.Mesh(new THREE.SphereGeometry(0.021, 10, 8), WHITE);
  spark.position.set(ex + 0.022, ey + 0.028, ez + 0.035);
  headPivot.add(spark);
});

// 鼻子
const nose = new THREE.Mesh(new THREE.SphereGeometry(0.048, 12, 10), PINK);
nose.scale.set(1.15, 0.85, 0.7);
nose.position.set(0, -0.055, 0.40);
headPivot.add(nose);

// 腮红
[[-0.245, -0.055, 0.285], [0.245, -0.055, 0.285]].forEach(([ex, ey, ez]) => {
  const blush = new THREE.Mesh(new THREE.SphereGeometry(0.062, 12, 10), PINK);
  blush.scale.set(1.2, 0.72, 0.4);
  blush.position.set(ex, ey, ez);
  headPivot.add(blush);
});

// ── 腿（Q 版短腿 + 奶白爪）──
// 腿要够长、且明显探出身体轮廓，小尺寸下才看得出"在跑"而不是"站着"
const thighGeo = new THREE.CapsuleGeometry(0.095, 0.22, 6, 14);
const pawGeo = new THREE.SphereGeometry(0.105, 14, 12);

// [x, y, z, 相位]  —— 对角同相（0 / 0.5）
// z 推到身体外侧（身体 z 向半径约 0.41），腿才不会被躯干挡住
const HIP = [
  [ 0.31, -0.24,  0.34, 0.0 ],   // 前左
  [-0.31, -0.24,  0.34, 0.5 ],   // 前右
  [ 0.30, -0.22, -0.34, 0.5 ],   // 后左
  [-0.30, -0.22, -0.34, 0.0 ],   // 后右
];

const legs = HIP.map(([hx, hy, hz, phase]) => {
  const hip = new THREE.Group();
  hip.position.set(hx, hy, hz);
  cat.add(hip);

  const thigh = new THREE.Mesh(thighGeo, FUR);
  thigh.position.set(0, -0.15, 0);
  hip.add(thigh);

  const paw = new THREE.Mesh(pawGeo, CREAM);
  paw.position.set(0, -0.32, 0.02);
  paw.scale.set(1.05, 0.85, 1.05);
  hip.add(paw);

  return { hip, phase, baseY: hy };
});

// ── 尾巴（3 节，向侧后方翘起）──
const tailSegs = [
  { len: 0.24, r: 0.072, color: FUR },
  { len: 0.22, r: 0.06,  color: FUR_D },
  { len: 0.18, r: 0.048, color: CREAM },
];
let tailParent = new THREE.Group();
tailParent.position.set(0.36, -0.06, -0.26);
tailParent.rotation.z = -0.85;
cat.add(tailParent);
const tail = [];
tailSegs.forEach((s, i) => {
  const seg = new THREE.Group();
  const m = new THREE.Mesh(new THREE.CapsuleGeometry(s.r, s.len, 6, 12), s.color);
  m.position.set(0, s.len / 2 + s.r * 0.55, 0);
  seg.add(m);
  if (i > 0) seg.position.y = tailSegs[i - 1].len + tailSegs[i - 1].r * 1.05;
  tailParent.add(seg);
  tail.push(seg);
  tailParent = seg;
});

// ── 动画 ──
function setFrame(t) {
  const p = t * Math.PI * 2;

  // 对角腿同相抬起：抬起时腿缩短并前伸
  legs.forEach(({ hip, phase, baseY }) => {
    const a = p + phase * Math.PI * 2;
    const lift = Math.max(0, Math.sin(a));
    hip.position.y = baseY + lift * 0.14;
    hip.rotation.x = -lift * 0.70;
    hip.rotation.z = lift * 0.18 * Math.sign(hip.position.x);
    hip.scale.y = 1 - lift * 0.16;
  });

  // 身体弹跳 + 左右微摆
  cat.position.y = Math.abs(Math.sin(p)) * 0.085;
  cat.rotation.z = Math.sin(p) * 0.055;

  // 头部延迟点头
  headPivot.position.y = 0.50 + Math.abs(Math.sin(p - 0.35)) * 0.035;
  headPivot.rotation.z = -Math.sin(p) * 0.05;
  headPivot.rotation.x = Math.sin(p * 2) * 0.04;

  // 尾巴逐节延迟摆动
  tail.forEach((seg, i) => {
    seg.rotation.z = Math.sin(p - i * 0.8) * 0.30;
    seg.rotation.x = Math.cos(p - i * 0.8) * 0.18;
  });
}

// ── 自动取景 ──
function fitCamera() {
  setFrame(0);
  cat.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(cat);
  const size = new THREE.Vector3(); box.getSize(size);
  const center = new THREE.Vector3(); box.getCenter(center);
  const half = Math.max(size.x, size.y) * 1.14 / 2;
  camera.left = -half; camera.right = half;
  camera.top = half; camera.bottom = -half;
  camera.position.set(center.x, center.y, 20);
  camera.lookAt(center.x, center.y, 0);
  camera.updateProjectionMatrix();
}
fitCamera();

window.renderFrame = function (i) {
  setFrame(i / FRAMES);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};
window.__diag = function () {
  cat.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(cat);
  const size = new THREE.Vector3(); box.getSize(size);
  const c = new THREE.Vector3(); box.getCenter(c);
  return {
    children: cat.children.length,
    size: [size.x, size.y, size.z],
    center: [c.x, c.y, c.z],
    cam: [camera.left, camera.right, camera.top, camera.bottom, camera.position.x, camera.position.y, camera.position.z],
    rendererInfo: JSON.stringify(renderer.info.render),
  };
};
window.FRAME_COUNT = FRAMES;
window.FRAME_W = SCENE_W;
window.FRAME_H = SCENE_H;
window.__ready = true;
</script>
</body>
</html>
